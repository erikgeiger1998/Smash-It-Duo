name: ClapTrap
options:
  bundleIdPrefix: com.erikgeiger
  deploymentTarget:
    iOS: "17.0"
targets:
  ClapTrap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ClapTrap/Sources
    info:
      path: ClapTrap/Info.plist
      properties:
        CFBundleDisplayName: "Smash it!"
        UIRequiredDeviceCapabilities:
          - "arm64"
        TARGETED_DEVICE_FAMILY: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - "UIInterfaceOrientationPortrait"
          - "UIInterfaceOrientationLandscapeLeft"
          - "UIInterfaceOrientationLandscapeRight"
        NSMotionUsageDescription: "Smash it! uses motion sensors to detect folding smashes."
    settings:
      base:
        PRODUCT_NAME: ClapTrap
        PRODUCT_MODULE_NAME: ClapTrap
        PRODUCT_BUNDLE_IDENTIFIER: com.erikgeiger.SmashIt
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Smash it!"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
  ClapTrapTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ClapTrap/Tests
    dependencies:
      - target: ClapTrap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
