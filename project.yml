name: ClapTrap
options:
  bundleIdPrefix: com.erikgeiger
  deploymentTarget:
    iOS: "17.0"
targets:
  ClapTrap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ClapTrap/Sources
    settings:
      base:
        PRODUCT_NAME: ClapTrap
        PRODUCT_BUNDLE_IDENTIFIER: com.erikgeiger.ClapTrap
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMotionUsageDescription: "ClapTrap uses motion sensors to detect folding slams and fast swats."
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
  ClapTrapTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ClapTrap/Tests
    dependencies:
      - target: ClapTrap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
